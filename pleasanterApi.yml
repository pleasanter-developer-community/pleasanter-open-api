swagger: '2.0'
info:
  title: Pleasanter API (非公式)
  version: 1.1.0
  description: Pleasanter APIドキュメント(デモ環境用)
host: demo.pleasanter.org
basePath: /
schemes:
  - https
securityDefinitions: {}
paths:
  /items/{siteIdOrRecordId}/get:
    post:
      operationId: ItemsGet
      summary: Items Get
      description: 指定した単一のレコードまたは、指定したテーブルの複数レコードを取得します。
      consumes:
        - application/json
      parameters:
        - name: siteIdOrRecordId
          in: path
          required: true
          type: integer
          format: int64
        - name: requestBody
          in: body
          schema:
            type: object
            properties:
              ApiVersion:
                $ref: '#/definitions/apiVersion'
              ApiKey:
                type: string
              Offset:
                type: integer
                description: ページングで後続のレコードを取得するためのオフセット値
              View:
                $ref: '#/definitions/view'
          required: true
      responses:
        '200':
          description: Success
          schema:
            type: object
            properties:
              StatusCode:
                type: integer
              LimitPerDate:
                type: integer
              LimitRemaining:
                type: integer
              Response:
                type: object
                properties:
                  Offset:
                    type: integer
                  PageSize:
                    type: integer
                  TotalCount:
                    type: integer
                  Data:
                    type: array
                    items:
                      $ref: '#/definitions/responseItem'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/error40x'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/error40x'
        '403':
          description: Not Found
          schema:
            $ref: '#/definitions/error40x'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error50x'
  /items/{recordId}/update:
    post:
      operationId: ItemsUpdate
      summary: Items Update
      description: 指定したレコードの内容を更新します。
      consumes:
        - application/json
      parameters:
        - name: recordId
          in: path
          required: true
          type: integer
          format: int64
        - name: requestBody
          in: body
          schema:
            $ref: '#/definitions/requestItem'
      responses:
        '200':
          description: Success
          schema:
            type: object
            properties:
              Id:
                type: integer
              StatusCode:
                type: integer
              LimitPerDate:
                type: integer
              LimitRemaining:
                type: integer
              Message:
                type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/error40x'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/error40x'
        '403':
          description: Not Found
          schema:
            $ref: '#/definitions/error40x'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error50x'
  /items/{siteId}/create:
    post:
      operationId: ItemsCreate
      summary: Items Create
      description: 指定したテーブルに新規レコードを作成します。
      consumes:
        - application/json
      parameters:
        - name: siteId
          in: path
          required: true
          type: integer
          format: int64
        - name: requestBody
          in: body
          schema:
            $ref: '#/definitions/requestItem'
      responses:
        '200':
          description: Success
          schema:
            type: object
            properties:
              Id:
                type: integer
              StatusCode:
                type: integer
              LimitPerDate:
                type: integer
              LimitRemaining:
                type: integer
              Message:
                type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/error40x'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/error40x'
        '403':
          description: Not Found
          schema:
            $ref: '#/definitions/error40x'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error50x'
  /items/{recordId}/delete:
    post:
      operationId: ItemsDelete
      summary: Items Delete
      description: 指定したレコードを削除します。
      consumes:
        - application/json
      parameters:
        - name: recordId
          in: path
          required: true
          type: integer
          format: int64
        - name: requestBody
          in: body
          schema:
            type: object
            properties:
              ApiVersion:
                $ref: '#/definitions/apiVersion'
              ApiKey:
                type: string
      responses:
        '200':
          description: Success
          schema:
            type: object
            properties:
              Id:
                type: integer
              StatusCode:
                type: integer
              LimitPerDate:
                type: integer
              LimitRemaining:
                type: integer
              Message:
                type: string
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/error40x'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/error40x'
        '403':
          description: Not Found
          schema:
            $ref: '#/definitions/error40x'
        '500':
          description: Internal Server Error
          schema:
            $ref: '#/definitions/error50x'
