        DescriptionV:
          $ref: '#/components/schemas/ImageHashItem'
        DescriptionW:
          $ref: '#/components/schemas/ImageHashItem'
        DescriptionX:
          $ref: '#/components/schemas/ImageHashItem'
        DescriptionY:
          $ref: '#/components/schemas/ImageHashItem'
        DescriptionZ:
          $ref: '#/components/schemas/ImageHashItem'

    ImageHashItem:
      type: object
      description: 画像挿入の詳細設定
      required:
        - Base64
      properties:
        HeadNewLine:
          type: boolean
          description: 画像を挿入する際の先頭の改行有無
        EndNewLine:
          type: boolean
          description: 画像を挿入する際の末尾の改行有無
        Position:
          type: integer
          description: 画像を何文字目に挿入するか（-1または省略で末尾）
        Alt:
          type: string
          description: alt属性に挿入する文字列
        Extension:
          type: string
          description: ファイル拡張子（省略時は.png）
          example: .jpeg
        Base64:
          type: string
          description: Base64エンコードした画像のバイナリデータ
