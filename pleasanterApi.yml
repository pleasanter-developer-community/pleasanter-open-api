openapi: 3.0.3
info:
  title: Pleasanter API (非公式)
  version: 1.1.0
  description: |
    Pleasanter APIドキュメント(デモ環境用)
    
    プリザンターのREST APIを使用して、レコードの取得・作成・更新・削除などの操作を行うことができます。
  contact:
    name: Pleasanter Developer Community
    url: https://github.com/pleasanter-developer-community
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://demo.pleasanter.org
    description: デモ環境

tags:
  - name: Items
    description: レコード操作API

paths:
  /items/{siteIdOrRecordId}/get:
    post:
      operationId: ItemsGet
      summary: レコード取得
      description: 指定した単一のレコードまたは、指定したテーブルの複数レコードを取得します。
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/SiteIdOrRecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemsGetRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsGetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /items/{recordId}/update:
    post:
      operationId: ItemsUpdate
      summary: レコード更新
      description: 指定したレコードの内容を更新します。
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /items/{siteId}/create:
    post:
      operationId: ItemsCreate
      summary: レコード作成
      description: 指定したテーブルに新規レコードを作成します。
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /items/{recordId}/delete:
    post:
      operationId: ItemsDelete
      summary: レコード削除
      description: 指定したレコードを削除します。
      tags:
        - Items
      parameters:
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiRequestBase'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  # ==================== Parameters ====================
  parameters:
    SiteIdOrRecordId:
      name: siteIdOrRecordId
      in: path
      required: true
      description: サイトIDまたはレコードID
      schema:
        type: integer
        format: int64

    SiteId:
      name: siteId
      in: path
      required: true
      description: サイトID
      schema:
        type: integer
        format: int64

    RecordId:
      name: recordId
      in: path
      required: true
      description: レコードID
      schema:
        type: integer
        format: int64

  # ==================== Responses ====================
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerErrorResponse'

  # ==================== Schemas ====================
  schemas:
    # ---------- Base/Common Schemas ----------
    ApiVersion:
      type: string
      description: APIバージョン
      enum:
        - '1.1'
        - '1.0'
      default: '1.1'

    ApiRequestBase:
      type: object
      description: API共通リクエストパラメータ
      properties:
        ApiVersion:
          $ref: '#/components/schemas/ApiVersion'
        ApiKey:
          type: string
          description: APIキー

    ApiResponseBase:
      type: object
      description: API共通レスポンスパラメータ
      properties:
        StatusCode:
          type: integer
          description: ステータスコード
        LimitPerDate:
          type: integer
          description: 1日あたりのAPI呼び出し制限数
        LimitRemaining:
          type: integer
          description: 残りのAPI呼び出し可能数

    # ---------- Error Schemas ----------
    ErrorResponse:
      type: object
      description: エラーレスポンス（4xx）
      properties:
        Id:
          type: integer
          format: int64
          description: レコードID
        StatusCode:
          type: integer
          description: ステータスコード
        Message:
          type: string
          description: エラーメッセージ

    ServerErrorResponse:
      type: object
      description: サーバーエラーレスポンス（5xx）
      properties:
        Message:
          type: string
          description: エラーメッセージ

    # ---------- Request Schemas ----------
    ItemsGetRequest:
      allOf:
        - $ref: '#/components/schemas/ApiRequestBase'
        - type: object
          properties:
            Offset:
              type: integer
              description: ページングで後続のレコードを取得するためのオフセット値
            View:
              $ref: '#/components/schemas/View'

    ItemRequest:
      allOf:
        - $ref: '#/components/schemas/ApiRequestBase'
        - $ref: '#/components/schemas/ItemData'
        - type: object
          properties:
            ProcessId:
              type: integer
              description: 実行するプロセスのID
            ProcessIds:
              type: array
              items:
                type: integer
              description: 実行する複数のプロセスIDの配列
            ImageHash:
              $ref: '#/components/schemas/ImageHash'
            RecordPermissions:
              type: array
              items:
                type: string
              description: 'レコードのアクセス制御を指定（例: User,10,1 / Dept,1,31 / Group,1,511）'

    # ---------- Response Schemas ----------
    ItemsGetResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            Response:
              type: object
              properties:
                Offset:
                  type: integer
                  description: 現在のオフセット値
                PageSize:
                  type: integer
                  description: 1ページあたりの件数
                TotalCount:
                  type: integer
                  description: 総件数
                Data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResponseItem'

    ItemMutationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            Id:
              type: integer
              format: int64
              description: 作成/更新/削除されたレコードID
            Message:
              type: string
              description: 結果メッセージ

    # ---------- View Schema ----------
    View:
      type: object
      description: フィルタやソートの条件を指定するオブジェクト
      properties:
        Incomplete:
          type: boolean
          description: 未完了のレコードのみ取得
        Own:
          type: boolean
          description: 自分が担当のレコードのみ取得
        NearCompletionTime:
          type: boolean
          description: 期限が近いレコードのみ取得
        Delay:
          type: boolean
          description: 遅延しているレコードのみ取得
        Overdue:
          type: boolean
          description: 期限超過のレコードのみ取得
        Search:
          type: string
          description: 検索キーワード
        ColumnFilterHash:
          type: object
          description: 列フィルタ条件をキーと値のペアで指定
          additionalProperties: true
        ColumnFilterSearchTypes:
          type: object
          description: 項目ごとの検索方法を指定
          additionalProperties:
            $ref: '#/components/schemas/ColumnFilterSearchType'
        ColumnFilterNegatives:
          type: array
          items:
            type: string
          description: 否定条件にする項目名の配列
        ColumnSorterHash:
          type: object
          description: ソート条件を項目名とasc/descのペアで指定
          additionalProperties:
            $ref: '#/components/schemas/SortOrder'
        ApiDataType:
          $ref: '#/components/schemas/ApiDataType'
        ApiColumnKeyDisplayType:
          $ref: '#/components/schemas/ApiColumnKeyDisplayType'
        ApiColumnValueDisplayType:
          $ref: '#/components/schemas/ApiColumnValueDisplayType'
        ApiColumnHash:
          type: object
          description: 項目単位でKey/Valueの表示形式を指定
          additionalProperties: true
        GridColumns:
          type: array
          items:
            type: string
          description: 返却される項目を制御する配列
        MergeSessionViewFilters:
          type: boolean
          description: セッションのフィルタ条件とマージするか
        MergeSessionViewSorters:
          type: boolean
          description: セッションのソート条件とマージするか

    # ---------- Enum Schemas ----------
    ColumnFilterSearchType:
      type: string
      description: 検索方法
      enum:
        - PartialMatch
        - ExactMatch
        - ForwardMatch
        - PartialMatchMultiple
        - ExactMatchMultiple
        - ForwardMatchMultiple

    SortOrder:
      type: string
      description: ソート順
      enum:
        - asc
        - desc

    ApiDataType:
      type: string
      description: APIの形式を指定（KeyValuesで表示名形式）
      enum:
        - Default
        - KeyValues

    ApiColumnKeyDisplayType:
      type: string
      description: レスポンスのKeyの表示形式を指定
      enum:
        - LabelText
        - ColumnName

    ApiColumnValueDisplayType:
      type: string
      description: レスポンスのValueの表示形式を指定
      enum:
        - DisplayValue
        - Value
        - Text

    # ---------- Item Data Schemas ----------
    ItemData:
      type: object
      description: レコードデータ
      properties:
        Title:
          type: string
          description: タイトル項目
        Body:
          type: string
          description: 内容項目
        StartTime:
          type: string
          format: date-time
          description: 開始日時（期限付きテーブルのみ）
        CompletionTime:
          type: string
          format: date-time
          description: 完了日時（期限付きテーブルのみ）
        WorkValue:
          type: number
          description: 作業量（期限付きテーブルのみ）
        ProgressRate:
          type: number
          description: 進捗率（期限付きテーブルのみ）
        RemainingWorkValue:
          type: number
          description: 残作業量（期限付きテーブルのみ）
        Status:
          type: integer
          description: 状況項目
        Manager:
          type: integer
          description: 管理者のユーザID
        Owner:
          type: integer
          description: 担当者のユーザID
        Locked:
          type: boolean
          description: ロック状態
        Comments:
          type: string
          description: コメント項目
        ItemTitle:
          type: string
          description: タイトル項目（別名）
        ClassHash:
          $ref: '#/components/schemas/ClassHash'
        NumHash:
          $ref: '#/components/schemas/NumHash'
        DateHash:
          $ref: '#/components/schemas/DateHash'
        DescriptionHash:
          $ref: '#/components/schemas/DescriptionHash'
        CheckHash:
          $ref: '#/components/schemas/CheckHash'
        AttachmentsHash:
          $ref: '#/components/schemas/AttachmentsHash'

    ResponseItem:
      allOf:
        - $ref: '#/components/schemas/ItemData'
        - type: object
          description: レコード取得時のレスポンスデータ
          properties:
            SiteId:
              type: integer
              format: int64
              description: サイトID
            UpdatedTime:
              type: string
              format: date-time
              description: 更新日時
            ResultId:
              type: integer
              format: int64
              description: レコードID（記録テーブルの場合）
            IssueId:
              type: integer
              format: int64
              description: レコードID（期限付きテーブルの場合）
            Ver:
              type: integer
              description: バージョン
            Creator:
              type: integer
              description: 作成者のユーザID
            Updator:
              type: integer
              description: 更新者のユーザID
            CreatedTime:
              type: string
              format: date-time
              description: 作成日時
            ApiVersion:
              type: number
              description: APIバージョン

    # ---------- Hash Schemas ----------
    ClassHash:
      type: object
      description: 分類項目（ClassA～ClassZのキーと値のペア）
