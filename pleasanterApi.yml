          - KeyValues
      ApiColumnKeyDisplayType:
        type: string
        enum:
          - LabelText
          - ColumnName
      ApiColumnValueDisplayType:
        type: string
        enum:
          - DisplayValue
          - Value
          - Text
      ApiColumnHash:
        type: object
      GridColumns:
        type: object
      MergeSessionViewFilters:
        type: boolean
      MergeSessionViewSorters:
